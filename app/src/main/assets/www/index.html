<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9d2a2">
<title>Suna</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view" aria-label="砂浜"></canvas>

<div id="top" class="bar">
  <button id="size" class="chip" type="button" aria-label="太さ">
    <span class="dot" aria-hidden="true"></span>
  </button>
  <button id="flow" class="chip" type="button" aria-label="湧き水の量">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2c3.2 4 5.5 7 5.5 10.1a5.5 5.5 0 0 1-11 0c0-3.1 2.3-6.1 5.5-10.1z"/></svg>
    <span class="level" aria-hidden="true"><i></i><i></i></span>
  </button>
  <button id="menu" class="chip" type="button" aria-label="メニュー">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
  </button>
</div>

<div id="tools" class="bar" role="toolbar">
  <button class="tool" type="button" data-tool="dig">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5h4.5c1.3 0 1.7 6 4.5 6s3.2-6 4.5-6H21"/><path d="M12 3.5v6.2M9.5 7.2 12 9.7l2.5-2.5"/></svg>
    <span data-i18n="dig">掘る</span>
  </button>
  <button class="tool" type="button" data-tool="pile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5h3.5c2 0 2.5-7 5.5-7s3.5 7 5.5 7H21"/><path d="M12 8.5V2.8M9.5 5.3 12 2.8l2.5 2.5"/></svg>
    <span data-i18n="pile">盛る</span>
  </button>
  <button class="tool" type="button" data-tool="smooth">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5c2-3 4-3 6 0s4 3 6 0 3.3-2.3 5-1" opacity=".5"/><path d="M3 16.5h18"/></svg>
    <span data-i18n="smooth">ならす</span>
  </button>
  <button class="tool" type="button" data-tool="pour">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2c3.2 4 5.5 7 5.5 10.1a5.5 5.5 0 0 1-11 0c0-3.1 2.3-6.1 5.5-10.1z"/></svg>
    <span data-i18n="pour">水</span>
  </button>
  <button class="tool" type="button" data-tool="spring">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="5.6" opacity=".7"/><circle cx="12" cy="12" r="9" opacity=".4"/></svg>
    <span data-i18n="spring">湧き水</span>
  </button>
</div>

<div id="hint" role="status"></div>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <h1>Suna</h1>
    <p data-i18n="help1">砂をなぞって掘ると、水が流れこみます。</p>
    <p data-i18n="help2">流れは少しずつ砂を削って、深くなっていきます。</p>
    <p data-i18n="help3">砂を盛ればせき止められます。けれど水は、横から回りこんだり、じわじわ染み出したりします。</p>
    <button id="sound" type="button"></button>
    <button id="reset" type="button" data-i18n="reset">砂浜をつくりなおす</button>
    <button id="close" type="button" class="primary" data-i18n="close">とじる</button>
  </div>
</div>

<div id="fatal" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
